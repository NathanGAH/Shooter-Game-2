<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shooter Game 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrapper">
    <div class="responsive-iframe-container">
      <iframe id="turbowarp-player" allowtransparency="true" allowfullscreen></iframe>
    </div>

    <!-- Instructions and Notes Container -->
    <div class="details-container">
      <div id="instructions-box" class="info-panel">
        <h2>Instructions</h2>
        <p id="instructions-content"></p>
      </div>
      <div id="notes-box" class="info-panel">
        <h2>Notes & Credits</h2>
        <p id="notes-content"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
